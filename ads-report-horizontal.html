<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datová architektura reportingu reklamních kampaní</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  .top{display:flex;align-items:center;gap:16px;padding:16px 28px;background:#fff;border-bottom:1px solid #e5e7eb}
  .top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
  .top .sub{font-size:13px;color:#6b7280;margin-top:2px}
  .ctrl{margin-left:auto;display:flex;gap:6px}
  .ctrl button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:#374151}
  .ctrl button:hover{background:#f3f4f6}
  #stage{position:relative;height:calc(100vh - 66px);overflow:hidden;cursor:grab;touch-action:none}
  #stage.drag{cursor:grabbing}
  #canvas{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;will-change:transform}
  #canvas svg{width:1600px;height:900px;display:block}
  @media print{
    body{overflow:visible;background:#fff}
    .ctrl{display:none}
    #stage{height:auto;overflow:visible}
    #canvas{position:static;transform:none!important;width:100%;height:auto}
    #canvas svg{width:100%;height:auto}
    @page{size:A4 landscape;margin:8mm}
  }
</style>
</head>
<body>

  <div>

    <div class="sub">DER Touristik × Data Club</div>

  <div class="ctrl">

<script>
(function(){
  const stage = document.getElementById('stage'), canvas = document.getElementById('canvas');
  const W = 1600, H = 900, MIN = .25, MAX = 4;
  let s = 1, tx = 0, ty = 0;
  const apply = () => canvas.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  function fit(){ const r = stage.getBoundingClientRect(); s = Math.min(r.width/W, r.height/H) * .96; tx = (r.width - W*s)/2; ty = (r.height - H*s)/2; apply(); }
  function zoomAt(f, cx, cy){ const ns = Math.min(MAX, Math.max(MIN, s*f)); const k = ns/s; tx = cx - (cx - tx)*k; ty = cy - (cy - ty)*k; s = ns; apply(); }
  stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.1 : 1/1.1, e.clientX - r.left, e.clientY - r.top); }, {passive:false});
  let drag = false, lx = 0, ly = 0;
  stage.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if(!drag) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply(); });
  ['pointerup','pointercancel'].forEach(ev => stage.addEventListener(ev, () => { drag = false; stage.classList.remove('drag'); }));
  let pinch = null; const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  stage.addEventListener('touchstart', e => { if(e.touches.length === 2) pinch = dist(e.touches); }, {passive:true});
  stage.addEventListener('touchmove', e => { if(e.touches.length === 2 && pinch){ const d = dist(e.touches), r = stage.getBoundingClientRect(); zoomAt(d/pinch, (e.touches[0].clientX + e.touches[1].clientX)/2 - r.left, (e.touches[0].clientY + e.touches[1].clientY)/2 - r.top); pinch = d; e.preventDefault(); } }, {passive:false});
  stage.addEventListener('touchend', () => pinch = null);
  document.getElementById('zin').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width/2, r.height/2); };
  document.getElementById('zout').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1/1.25, r.width/2, r.height/2); };
  document.getElementById('fit').onclick = fit; stage.addEventListener('dblclick', fit); window.addEventListener('resize', fit); fit();
})();
</script>
