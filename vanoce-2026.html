
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E2A1F">
<title>Tajný Ježíšek 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#0E2A1F;--pine2:#07170F;--ivory:#FFF9EE;--ink:#1E2A24;--soft:#5E6B63;--red:#B8322A;--red2:#8F231D;--gold:#D9A441;--line:#E9DFCB;--snow:#EAF3EE;--mist:#A9C2B5}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;padding:calc(2rem + env(safe-area-inset-top,0px)) 1.25rem calc(2rem + env(safe-area-inset-bottom,0px));background-color:#0E2A1F;background-image:radial-gradient(120% 80% at 50% 0%,#1B4432 0%,#0E2A1F 45%,#07170F 100%);background-attachment:fixed;color:var(--snow);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden}
main{margin:auto;width:100%;max-width:24rem;position:relative;z-index:1}
.snowfield{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden;z-index:0}
.flake{position:absolute;top:-12px;border-radius:50%;background:#fff;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{0%{transform:translate3d(0,-5vh,0)}50%{transform:translate3d(24px,52vh,0)}100%{transform:translate3d(-12px,110vh,0)}}
header{text-align:center;margin-bottom:1.5rem}
.gift{display:block;width:84px;height:84px;margin:0 auto .75rem}
h1{margin:0;font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:700;font-size:2.6rem;line-height:1.05;letter-spacing:-.01em;color:#fff}
.sub{margin:.5rem 0 0;color:var(--mist);font-size:1.05rem}
.card{position:relative;background:var(--ivory);color:var(--ink);border-radius:22px;padding:1.75rem 1.4rem 1.5rem;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.card::before{content:"";position:absolute;top:0;left:50%;width:54px;height:10px;margin-left:-27px;background:var(--gold);border-radius:0 0 8px 8px}
.card p{margin:0}
.label{display:block;font-weight:700;font-size:1.15rem;margin-bottom:.25rem}
.hint{color:var(--soft);font-size:.95rem;margin-bottom:1rem !important}
.code{display:block;width:100%;font-family:inherit;font-size:1.9rem;font-weight:700;letter-spacing:.22em;text-indent:.22em;text-align:center;padding:.7rem .4rem;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.code::placeholder{color:#CFC6B4}
.code:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,164,65,.28)}
.btn{display:block;width:100%;margin-top:.9rem;font-family:inherit;font-size:1.1rem;font-weight:700;padding:.95rem 1rem;border:0;border-radius:14px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--red2);-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
.btn:hover{background:#C53A31}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ghost{background:transparent;color:var(--soft);box-shadow:none;font-weight:600;font-size:1rem;padding:.6rem;margin-top:.6rem}
.ghost:hover{background:transparent;color:var(--ink)}
.ghost:active{transform:none;box-shadow:none}
.err{min-height:1.5em;margin-top:.75rem !important;color:var(--red2);font-weight:600;font-size:.95rem}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.eyebrow{color:var(--soft);font-size:1rem}
.name{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:700;font-size:2.3rem;line-height:1.1;margin:.15rem 0 0 !important;overflow-wrap:anywhere}
.to{color:var(--red);font-size:2.7rem}
.divider{height:0;border:0;border-top:2px dashed var(--line);margin:1.25rem 0}
.pop{animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.facts{list-style:none;margin:1.25rem 0 0;padding:0;text-align:left}
.facts li{display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;border-radius:12px;background:#F6EEDC;font-size:1rem;line-height:1.35}
.facts li+li{margin-top:.5rem}
.facts span{font-size:1.35rem;line-height:1}
.burst{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:fly 1.2s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.rules{list-style:none;margin:1.5rem 0 0;padding:0;color:var(--mist);font-size:.95rem;text-align:center}
.rules li+li{margin-top:.3rem}
[hidden]{display:none !important}
@media (min-width:600px){h1{font-size:3.2rem}.card{padding:2.1rem 1.9rem 1.8rem}}
@media (prefers-reduced-motion:reduce){.flake,.pop,.shake,.burst i{animation:none}.burst{display:none}}
</style>
</head>
<body>
<div class="snowfield" id="snow" aria-hidden="true"></div>
<main>
<header>
<svg class="gift" viewBox="0 0 96 96" aria-hidden="true"><path d="M48 31c-7-16-29-15-24-2 3 7 15 5 24 2z" fill="#D9A441"/><path d="M48 31c7-16 29-15 24-2-3 7-15 5-24 2z" fill="#E8B95A"/><rect x="16" y="44" width="64" height="42" rx="5" fill="#B8322A"/><rect x="10" y="30" width="76" height="17" rx="5" fill="#CF4339"/><rect x="42" y="30" width="12" height="56" fill="#D9A441"/><circle cx="48" cy="31" r="5" fill="#C18D2E"/></svg>
<h1>Tajný Ježíšek</h1>
<p class="sub">Rodinné losování dárků 2026</p>
</header>
<section class="card" id="card">
<div id="stepCode">
<label class="label" for="code">Zadej svůj kód</label>
<p class="hint">Najdeš ho ve zprávě, kterou jsi dostal(a).</p>
<input class="code" id="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" placeholder="······" aria-describedby="err">
<button class="btn" id="open" type="button">Otevřít jmenovku</button>
<p class="err" id="err" role="alert"></p>
</div>
<div id="stepMe" hidden>
<p class="eyebrow">Tahle jmenovka patří</p>
<p class="name" id="me"></p>
<div id="secret" hidden>
<hr class="divider">
<p class="eyebrow">Dárek dáváš</p>
<p class="name to pop" id="to"></p>
<ul class="facts">
<li><span aria-hidden="true">🎁</span>Dárek má být do 1000 Kč.</li>
<li><span aria-hidden="true">🤫</span>Nikomu neříkej, koho máš.</li>
</ul>
</div>
<button class="btn" id="show" type="button">Rozbalit, komu dávám dárek</button>
<button class="btn ghost" id="close" type="button">Zavřít jmenovku</button>
<div class="burst" id="burst" aria-hidden="true"></div>
</div>
</section>
<ul class="rules">
<li>Každý dává jeden dárek a jeden dostane.</li>
<li>Kdo komu dává, zůstává tajemstvím.</li>
</ul>
</main>
<script>

var BLOBS=[

];
var MARK="JEZ26|";
function seedOf(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function stream(code,n){var a=seedOf("jezisek:"+code),out=[];for(var i=0;i<n;i++){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;out.push(((t^(t>>>14))>>>0)&255);}return out;}
function decryptWith(code){for(var b=0;b<BLOBS.length;b++){var hex=BLOBS[b],n=hex.length/2,k=stream(code,n),o=new Uint8Array(n);for(var i=0;i<n;i++){o[i]=parseInt(hex.substr(i*2,2),16)^k[i];}try{var txt=new TextDecoder("utf-8",{fatal:true}).decode(o);if(txt.indexOf(MARK)===0){var p=txt.slice(MARK.length).trim().split("|");if(p.length===2){return {me:p[0],to:p[1]};}}}catch(e){}}return null;}

(function(){
function $(id){return document.getElementById(id);}
var calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var snow=$("snow");
for(var s=0;s<(calm?0:34);s++){var f=document.createElement("span");f.className="flake";var size=2+Math.random()*5;f.style.width=size+"px";f.style.height=size+"px";f.style.left=(Math.random()*100)+"%";f.style.opacity=(0.35+Math.random()*0.6).toFixed(2);f.style.animationDuration=(9+Math.random()*12).toFixed(1)+"s";f.style.animationDelay=(-Math.random()*20).toFixed(1)+"s";snow.appendChild(f);}
function fail(msg){$("err").textContent=msg;var c=$("code");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");}
function tryOpen(){var code=$("code").value.replace(/\D/g,"");if(!code){fail("Napiš kód, který ti přišel ve zprávě.");return;}var r=decryptWith(code);if(!r){fail("Tenhle kód nesedí. Zkontroluj ho a zkus to znovu.");return;}$("me").textContent=r.me;$("to").textContent=r.to;$("stepCode").hidden=true;$("stepMe").hidden=false;$("secret").hidden=true;$("show").hidden=false;}
function confetti(){if(calm){return;}var box=$("burst"),cols=["#B8322A","#D9A441","#1B6B4A","#E8B95A","#CF4339"];box.innerHTML="";for(var i=0;i<42;i++){var p=document.createElement("i"),ang=Math.random()*Math.PI*2,dist=90+Math.random()*150;p.style.background=cols[i%cols.length];p.style.setProperty("--x",Math.round(Math.cos(ang)*dist)+"px");p.style.setProperty("--y",Math.round(Math.sin(ang)*dist-60)+"px");p.style.setProperty("--r",Math.round(Math.random()*720-360)+"deg");p.style.animationDelay=(Math.random()*0.12).toFixed(2)+"s";box.appendChild(p);}setTimeout(function(){box.innerHTML="";},1600);}
$("open").addEventListener("click",tryOpen);
$("code").addEventListener("keydown",function(e){if(e.key==="Enter"){tryOpen();}});
$("code").addEventListener("input",function(){$("err").textContent="";});
$("show").addEventListener("click",function(){$("secret").hidden=false;$("show").hidden=true;confetti();});
$("close").addEventListener("click",function(){$("me").textContent="";$("to").textContent="";$("code").value="";$("stepMe").hidden=true;$("stepCode").hidden=false;});
var fromLink=(location.hash||"").replace(/\D/g,"");
if(fromLink){$("code").value=fromLink;tryOpen();}
})();
