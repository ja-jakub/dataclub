<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meiro Clients Overview Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Chosen Palette: Slate and Indigo (Minimalist) -->
    <!-- Application Structure Plan: Původní minimalistický grid doplněný o dynamické drop-down ("accordion") sekce s editovatelným obsahem. Obsah se ukládá do LocalStorage pro perzistenci dat. Toto uspořádání zajišťuje fixní pohled na statické metriky nahoře a variabilní prostor pro pracovní/provozní poznámky dole. -->
    <!-- Visualization & Content Choices: 
         - Goal: Organize/Inform -> Viz: Rozbalovací sekce s contenteditable (HTML/JS/Tailwind) -> Interaction: Kliknutí pro rozbalení, kliknutí do textu pro úpravu, oninput auto-save -> Justification: Nejlepší řešení pro textový reporting s nutností editace bez externí DB. Podklady Trioly uloženy do defaultního stavu JS.
         - CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .editable-content {
            min-height: 100px;
        }
        .editable-content p { margin-bottom: 0.75rem; }
        .editable-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .editable-content li { margin-bottom: 0.25rem; }
        .editable-content h4 { font-weight: 700; color: #1e293b; margin-top: 1.5rem; margin-bottom: 0.5rem; font-size: 1.1rem; }
        .editable-content a { color: #4f46e5; text-decoration: underline; }
        
        .editable-content:focus {
            outline: none;
            box-shadow: 0 0 0 2px #e2e8f0;
            background-color: #ffffff;
            border-radius: 0.375rem;
            padding: 0.5rem;
            margin: -0.5rem;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b-2 border-slate-200 pb-4">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Přehled klientů v Meiro</h1>
            <p class="text-slate-500 mt-2">Doplněno o editovatelné poznámky a úkoly (ukládají se lokálně).</p>
        </header>

        <div id="clients-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
        </div>

        <div class="space-y-4">
            
            <div class="border-2 border-slate-200 rounded-lg bg-white overflow-hidden shadow-sm">
                <button onclick="toggleAccordion('section1')" class="w-full text-left px-6 py-4 font-bold text-slate-800 flex justify-between items-center bg-slate-50 hover:bg-slate-100 transition-colors">
                    <span class="flex items-center gap-3">
                        <span class="text-xl">📊</span> Reporting
                        <span class="text-xs font-normal text-slate-400 bg-white px-2 py-1 rounded border border-slate-200">Auto-save</span>
                    </span>
                    <span id="icon-section1" class="text-slate-400">▼</span>
                </button>
                <div id="section1" class="hidden px-6 py-6 border-t border-slate-100">
                    <div contenteditable="true" id="content-section1" class="editable-content text-sm text-slate-700" oninput="saveToLocalStorage('section1')">
                    </div>
                </div>
            </div>

            <div class="border-2 border-slate-200 rounded-lg bg-white overflow-hidden shadow-sm">
                <button onclick="toggleAccordion('section2')" class="w-full text-left px-6 py-4 font-bold text-slate-800 flex justify-between items-center bg-slate-50 hover:bg-slate-100 transition-colors">
                    <span class="flex items-center gap-3">
                        <span class="text-xl">⚡</span> Řešení problémů: Journey Canvas
                        <span class="text-xs font-normal text-slate-400 bg-white px-2 py-1 rounded border border-slate-200">Auto-save</span>
                    </span>
                    <span id="icon-section2" class="text-slate-400">▼</span>
                </button>
                <div id="section2" class="hidden px-6 py-6 border-t border-slate-100">
                    <div contenteditable="true" id="content-section2" class="editable-content text-sm text-slate-700" oninput="saveToLocalStorage('section2')">
                    </div>
                </div>
            </div>

            <div class="border-2 border-slate-200 rounded-lg bg-white overflow-hidden shadow-sm">
                <button onclick="toggleAccordion('section3')" class="w-full text-left px-6 py-4 font-bold text-slate-800 flex justify-between items-center bg-slate-50 hover:bg-slate-100 transition-colors">
                    <span class="flex items-center gap-3">
                        <span class="text-xl">📝</span> Status klientů & Poznámky
                        <span class="text-xs font-normal text-slate-400 bg-white px-2 py-1 rounded border border-slate-200">Auto-save</span>
                    </span>
                    <span id="icon-section3" class="text-slate-400">▼</span>
                </button>
                <div id="section3" class="hidden px-6 py-6 border-t border-slate-100">
                    <div contenteditable="true" id="content-section3" class="editable-content text-sm text-slate-700" oninput="saveToLocalStorage('section3')">
                    </div>
                </div>
            </div>

        </div>
    </div>

            'section2': `

            'section3': `
                <h4>Kalkulátor</h4>
                <ul>
                    <li>Funguje, spokojený.</li>

</li>
                        </ul>
                    </li>
                </ul>

                <h4>Vyhraj</h4>
                <ul>

                </ul>

                <h4>Scaleupboard</h4>

                </ul>

                <ul>
                    <li>Zvládli jsme rebranding.</li>

        };

        document.addEventListener('DOMContentLoaded', () => {
            renderClientCards();
            loadFromLocalStorage();
        });

        function renderClientCards() {
            const container = document.getElementById('clients-container');
            
            clientsData.forEach(client => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-lg shadow-sm border-2 border-slate-200 p-6 flex flex-col h-full";
                
                const sourcesHTML = client.sources.map(s => `<li class="text-sm text-slate-700 py-1 border-b border-slate-50 last:border-0">• ${s}</li>`).join('');
                let destinationsHTML = client.destinations.map(d => `<li class="text-sm text-slate-700 py-1 border-b border-slate-50 last:border-0">• ${d}</li>`).join('');
                
                if (client.destinationsNote) {
                    destinationsHTML += `<li class="text-xs text-amber-600 mt-2 font-medium border-t border-slate-100 pt-2">${client.destinationsNote}</li>`;
                }

                const tesValue = client.tesDisplay ? client.tesDisplay : client.tes + 'M';

                card.innerHTML = `
                    <div class="mb-4 pb-4 border-b-2 border-slate-100 flex justify-between items-start">
                        <h2 class="text-2xl font-bold text-slate-900">${client.name}</h2>
                        <div class="text-right">
                            <span class="block text-2xl font-black text-indigo-600">${tesValue}</span>
                            <span class="text-xs text-slate-500 uppercase tracking-wide font-semibold">TES</span>
                        </div>
                    </div>
                    
                    <div class="flex-grow grid grid-cols-2 gap-4">
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Sources (${client.sourcesCount})</h3>
                            <ul class="space-y-1">
                                ${sourcesHTML}
                            </ul>
                        </div>
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Destinations (${client.destinationsCount})</h3>
                            <ul class="space-y-1">
                                ${destinationsHTML}
                            </ul>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.innerText = '▲';
            } else {
                el.classList.add('hidden');
                icon.innerText = '▼';
            }
        }

        function saveToLocalStorage(sectionId) {
            const content = document.getElementById('content-' + sectionId).innerHTML;
            localStorage.setItem('meiro_dash_v3_' + sectionId, content);
        }

        function loadFromLocalStorage() {
            ['section1', 'section2', 'section3'].forEach(id => {
                const saved = localStorage.getItem('meiro_dash_v3_' + id);
                const contentDiv = document.getElementById('content-' + id);
                
                if (saved !== null) {
                    contentDiv.innerHTML = saved;
                } else {
                    contentDiv.innerHTML = defaultContents[id];
                }
            });
        }
    </script>
</body>
</html>
